# ============================================================
# Конфигурация биддера. Секреты — в .env.
# ============================================================

mode:
  sandbox: true
  dry_run: true

campaign:
  id: 12345678
  client_login: null

api:
  timeout: 30
  retry_count: 3
  max_concurrent: 5
  max_keywords_per_batch: 50

logging:
  file: logs/bidder.log
  level: INFO

# Файл состояния: здесь хранится, на каком шаге скальпинга каждая фраза
state:
  file: state.json

# ============================================================
# Общие лимиты — работают в обоих режимах
# ============================================================
limits:
  max_bid: 150         # никогда не выше
  min_bid: 30          # и не ниже
  no_downgrade: true   # понижать ставки запрещено

# ============================================================
# Выбор стратегии: 'scalping' или 'rules'
# ============================================================
strategy: scalping

# ============================================================
# Режим scalping: адаптивно поднимаем ставку, пока не выиграем аукцион
# ============================================================
scalping:
  start_bid: 30        # с чего начинаем (совпадает с min_bid)
  base_step: 5         # первый шаг
  step_increment: 5    # на сколько растёт шаг за каждый шаг
  max_step: 50         # потолок шага (даже если n большой)

# При шагах 5, 10, 15, 20, 25, ... от 30 ₽:
#   30 → 35 → 45 → 60 → 80 → 105 → (cap по entry или max_bid)
# В среднем 4–5 запусков до победы на типичных ценах 60–100 ₽.

# ============================================================
# Режим rules (используется только при strategy: rules)
# ============================================================
rules:
  defaults:
    bid: 100
    reason: "ни одно правило не сработало → default"

  rules:
    - name: "Нет данных о цене входа"
      enabled: true
      when:
        premium_entry_price: null
      then:
        type: fixed
        value: 100

    - name: "Дёшево войти в спецразмещение"
      enabled: true
      when:
        premium_entry_price:
          lt: 150
      then:
        type: entry_plus
        add: 5

    - name: "Дорогой вход — держим фикс"
      enabled: true
      when:
        premium_entry_price:
          gte: 150
      then:
        type: fixed
        value: 100